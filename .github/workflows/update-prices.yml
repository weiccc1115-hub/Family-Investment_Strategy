name: Daily Stock Price Update

on:
  schedule:
    # UTC 08:30 = 台灣時間 16:30（週一至週五台股收盤後自動更新）
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir yfinance

      - name: Fetch latest stock prices
        run: python update_prices.py

      - name: Commit and push prices.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update daily stock prices"
          git push
